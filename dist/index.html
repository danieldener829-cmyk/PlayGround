<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #f1f5f9; }
  main { max-width: 720px; padding: 48px 32px; text-align: center; }
  h1 { font-size: 3rem; margin: 0 0 12px; letter-spacing: -0.02em; }
  p { font-size: 1.125rem; line-height: 1.6; color: #cbd5e1; }
  .card { margin-top: 24px; padding: 20px; border: 1px solid #334155; border-radius: 16px; background: #1e293b; }
  button { margin-top: 16px; padding: 12px 24px; font-size: 1rem; border-radius: 999px; border: 0; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; }
  #count { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
<h1>PlayGround</h1>
<p>Static preview is running. Build output lives in <code>dist/</code> inside the project.</p>
<div class="card">
<div>Render check: <strong id="status">ready</strong> — clicks: <span id="count">0</span></div>
<button id="play" type="button">Play</button>
</div>
</main>
<script>
document.getElementById('play').addEventListener('click', () => {
  const el = document.getElementById('count');
  el.textContent = String(Number(el.textContent) + 1);
});
document.getElementById('status').textContent = 'ready';
</script>
</body>
</html>
