events {}
http {
  upstream web { server web:3000; }
  server {
    listen 80;
    server_name hostbots.com.br *.hostbots.com.br;
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    # Certbot/Let's Encrypt: docker exec nginx certbot … (ver deploy-vps.sh)
  }
}
