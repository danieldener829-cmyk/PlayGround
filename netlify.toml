# Netlify — deploy do Site Genius (+ gateway de subdomínios via JS, sem config extra)
[build]
  publish = "dist"
  command = "npm run build"

# Arquivos de /s/* são os sites publicados — servir direto, sem fallback
[[redirects]]
  from = "/s/*"
  to = "/s/:splat"
  status = 200

# SPA: qualquer outra rota cai no index (o roteamento é por hash #/...)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
